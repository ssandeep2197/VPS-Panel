name: VPSPanel
options:
  bundleIdPrefix: in.co.helloworlds
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    # Overridden per upload by deploy/testflight.sh (git commit count)
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: XXCJ44UPMW
schemes:
  VPSPanel:
    build:
      targets:
        VPSPanel: all
        VPSPanelUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - VPSPanelUITests
targets:
  VPSPanelUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: VPSPanelUITests
    dependencies:
      - target: VPSPanel
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: in.co.helloworlds.vpspanel.uitests
        TEST_TARGET_NAME: VPSPanel
        CODE_SIGN_STYLE: Automatic
  VPSPanel:
    type: application
    platform: iOS
    sources:
      - path: VPSPanel
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: in.co.helloworlds.vpspanel
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_CFBundleDisplayName: VPS Panel
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
    info:
      path: VPSPanel/Info.plist
      properties:
        CFBundleDisplayName: VPS Panel
        UILaunchScreen: {}
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UIBackgroundModes: []
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.developer-tools
