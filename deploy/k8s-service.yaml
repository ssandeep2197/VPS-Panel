# Routes cluster traffic to the panel, which runs on the host (not in a pod)
# and listens on the docker bridge address. Same pattern as bulk-email.
apiVersion: v1
kind: Service
metadata:
  name: vps-panel
  namespace: default
spec:
  ports:
    - name: http
      port: 80
      targetPort: 4600
---
apiVersion: v1
kind: Endpoints
metadata:
  name: vps-panel
  namespace: default
subsets:
  - addresses:
      - ip: 172.17.0.1
    ports:
      - name: http
        port: 4600
